# Fase 5 - Aplicación multi-servicio para Dokploy
# Ajustes respecto a la guía: sin "version" (obsoleto), sin container_name ni
# puertos fijos (Dokploy/Traefik enrutan por dominio) y la app con un comando
# para que no se apague al arrancar.
services:
  app:
    image: node:20-alpine
    command: >
      node -e "require('http').createServer((q,s)=>{s.setHeader('Content-Type','application/json');s.end(JSON.stringify({servicio:'compose-webapp',fecha:new Date()}))}).listen(3000,()=>console.log('compose-webapp en 3000'))"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ../files/app-data:/app/data
    restart: unless-stopped

  mongodb:
    image: mongo:7
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin_compose
      - MONGO_INITDB_ROOT_PASSWORD=mongo_compose_2026
      - MONGO_INITDB_DATABASE=compose_db
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      - PMA_HOST=db-service
      - PMA_PORT=3306
    depends_on:
      - db-service
    restart: unless-stopped

  db-service:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root_compose_2026
      - MYSQL_DATABASE=compose_db
      - MYSQL_USER=admin_compose
      - MYSQL_PASSWORD=compose_pass_2026
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mongo-data:
  mysql-data:
